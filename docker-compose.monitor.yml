# docker-compose.monitoring.yml
services:
  # PostgreSQL Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: certdb-pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'  # Disable login for single user
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cert-network
    restart: unless-stopped

  # Redis/Valkey Management (pilih salah satu)
  redis-ui:
    image: patrikx3/p3x-redis-ui:latest
    container_name: certdb-redis-ui
    ports:
      - "127.0.0.1:7843:7843"
    volumes:
      - redis-ui_data:/settings
    networks:
      - cert-network
    restart: unless-stopped

networks:
  cert-network:
    name: cert-network
    external: true  # Use existing network from docker-compose.prod.yml

volumes:
  pgadmin_data:
  redis-ui_data: