# docker-compose.yml (Development)
services:
  postgres:
    image: postgres:16-alpine
    container_name: certdb-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cert-network

  valkey:
    image: valkey/valkey:8
    container_name: certdb-valkey
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cert-network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: certdb-gotenberg
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-timeout=30s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cert-network

  minio:
    image: minio/minio:latest
    container_name: certdb-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cert-network

  # API & Worker - for full stack development
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: certdb-api
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      STORAGE_TYPE: minio
      DB_HOST: ${DB_HOST} 
      DB_PORT: ${DB_PORT} 
      DB_NAME: ${DB_NAME} 
      DB_USER: ${DB_USER} 
      DB_PASSWORD: ${DB_PASSWORD} 
      DB_SSLMODE: ${DB_SSLMODE} 
      VALKEY_HOST: ${VALKEY_HOST} 
      VALKEY_PORT: ${VALKEY_PORT}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      MINIO_HOST: ${MINIO_HOST} 
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET} 
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      TEMPLATE_PATH: ${TEMPLATE_PATH} 
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOTENBERG_URL: ${GOTENBERG_URL} 
    volumes:
      - ./templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cert-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: certdb-worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      STORAGE_TYPE: minio
      DB_HOST: ${DB_HOST} 
      DB_PORT: ${DB_PORT} 
      DB_NAME: ${DB_NAME} 
      DB_USER: ${DB_USER} 
      DB_PASSWORD: ${DB_PASSWORD} 
      DB_SSLMODE: ${DB_SSLMODE} 
      VALKEY_HOST: ${VALKEY_HOST} 
      VALKEY_PORT: ${VALKEY_PORT}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      MINIO_HOST: ${MINIO_HOST} 
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET} 
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      TEMPLATE_PATH: ${TEMPLATE_PATH} 
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOTENBERG_URL: ${GOTENBERG_URL} 
    volumes:
      - ./templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cert-network
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  minio_data:

networks:
  cert-network:
    driver: bridge
