services:
  postgres:
    image: postgres:16-alpine
    container_name: certdb-postgres
    environment:
      POSTGRES_DB: certdb 
      POSTGRES_USER: certuser
      POSTGRES_PASSWORD: certpass 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cert-network

  valkey:
    image: valkey/valkey:8
    container_name: certdb-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cert-network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: certdb-gotenberg
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-timeout=30s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cert-network

  minio:
    image: minio/minio:latest
    container_name: certdb-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cert-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: certdb-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      VALKEY_URL: valkey:6379
      GOTENBERG_URL: http://gotenberg:3000
      TEMPLATE_PATH: /app/templates/certificate.html
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
    volumes:
      - ./templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - cert-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: certdb-worker
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      VALKEY_URL: valkey:6379
      GOTENBERG_URL: http://gotenberg:3000
      TEMPLATE_PATH: /app/templates/certificate.html
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
    volumes:
      - ./templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - cert-network
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  minio_data:

networks:
  cert-network:
    driver: bridge